name: dr_dina_educology
description: "Dr. Dina - Educology. Developer - Azmir Khan"

publish_to: 'none'

version: 1.0.3+14

environment:
  sdk: ^3.10.1


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  get: ^4.7.3
  flutter_screenutil: ^5.9.3
  flutter_native_splash: ^2.4.7
  http: ^1.6.0
  get_storage: ^2.1.1
  flutter_gen_runner: ^5.12.0
  flutter_svg: ^2.2.3
  image_picker: ^1.2.1
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  upgrader: ^13.0.0
  pin_code_fields: ^8.0.1
  flutter_quill: ^11.5.1
  flutter_image_compress: ^2.4.0
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^20.1.0
  intl_phone_field: ^3.2.0
  flutter_html: ^3.0.0
  table_calendar: ^3.2.0
  flutter_pdfview: ^1.4.4
  path_provider: ^2.1.5
  vsc_quill_delta_to_html: ^1.0.5
  file_picker: ^10.3.10
  html: ^0.15.6
  url_launcher: ^6.3.2
  device_info_plus: '>=11.0.0 <14.0.0'
  path_provider_android: ^2.2.22
  permission_handler: ^12.0.1
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_web_auth_2: ^5.0.2
  nextgen_pdf_editor:
    path: ./packages/nextgen_pdf_editor
  open_file: ^3.5.11
  flutter_launcher_icons: ^0.14.4
  flutter_file_dialog: ^3.0.3
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  build_runner: ^2.11.0


flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter_regular.otf
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins_regular.ttf
    - family: SfPro
      fonts:
        - asset: assets/fonts/sf_pro_regular.otf


flutter_gen:
    output: lib/core/assets_gen

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_launcher_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  # dart run flutter_native_splash:create
  color: "#ffffff"  ##========[REQUIRED]==========
  color_dark: "#ffffff"
  image: assets/images/splash_logo.png
  image_dark: assets/images/splash_logo.png
  fullscreen: true
  android_12:
    color: "#ffffff"
    color_dark: "#ffffff"
    image: assets/images/splash_logo.png
    icon_background_color: "#ffffff"
